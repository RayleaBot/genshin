<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>{{ .Stylesheet }}</style></head>
<body>
<div class="container" id="container">
  <div class="head_box">
    <div class="id_text">ID: {{ .uid }}</div>
    <h2 class="day_text">充值统计</h2>
    <img class="genshin_logo" data-render-resource="genshin-logo" alt="">
  </div>
  <div class="data_box">
    <div class="tab_lable">数据总览</div>
    {{ range .lines }}
    <div class="data_line">
      {{ range . }}
      <div class="data_line_item">
        <div class="num">{{ .value }}</div>
        <div class="lable">{{ .title }}</div>
      </div>
      {{ end }}
    </div>
    {{ end }}
  </div>
  <div class="data_box">
    <div class="tab_lable">月份统计</div>
    <div id="chartContainer">
      {{ with .bar }}
      <svg width="{{ .width }}" height="{{ .height }}" viewBox="0 0 {{ .width }} {{ .height }}">
        <defs><linearGradient id="bar-fill" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1268f3"></stop><stop offset="0.6" stop-color="#08a4fa"></stop><stop offset="1" stop-color="#01ccfe"></stop></linearGradient></defs>
        <rect x="5" y="5" width="25" height="14" rx="3.5" fill="url(#bar-fill)"></rect><text class="legend-text" x="35" y="12">金额</text>
        {{ range .ticks }}<line class="split" x1="{{ $.bar.left }}" x2="{{ $.bar.right }}" y1="{{ .y }}" y2="{{ .y }}"></line><text class="axis-y-label" x="{{ $.bar.axis_x }}" y="{{ .y }}">{{ .label }}</text>{{ end }}
        <line class="axis-x" x1="{{ .left }}" x2="{{ .right }}" y1="{{ .bottom }}" y2="{{ .bottom }}"></line>
        {{ range .separators }}<line class="axis-tick" x1="{{ .x }}" x2="{{ .x }}" y1="{{ $.bar.bottom }}" y2="{{ $.bar.tick_bottom }}"></line>{{ end }}
        {{ range .bars }}<rect x="{{ .x }}" y="{{ .y }}" width="{{ .width }}" height="{{ .height }}" fill="url(#bar-fill)"></rect><text class="bar-value" x="{{ .center }}" y="{{ .value_y }}">{{ .value }}</text>{{ if .label }}<text class="axis-x-label" x="{{ .center }}" y="{{ $.bar.label_y }}">{{ .label }}</text>{{ end }}{{ end }}
      </svg>
      {{ end }}
    </div>
  </div>
  <div class="data_box">
    <div class="tab_lable">详细统计</div>
    <div id="chartContainer2">
      <svg width="470" height="300" viewBox="0 0 470 300">
        {{ range .pie }}<path d="{{ .path }}" fill="{{ .color }}"></path>{{ end }}
        {{ range .pie }}<path class="label-line" d="{{ .line }}" stroke="{{ .color }}"></path><text class="pie-label" x="{{ .x }}" y="{{ .y }}" text-anchor="{{ .anchor }}">{{ .name }}:￥{{ .value }} ({{ .percent }}%)</text>{{ end }}
        <text class="pie-title" x="465" y="5">{{ .total }}</text>
        <text class="pie-subtitle" x="465" y="33">总充值</text>
        {{ range .legend }}<rect x="{{ .x }}" y="{{ .y }}" width="25" height="14" rx="3.5" fill="{{ .color }}"></rect><text class="legend-text" x="{{ .text_x }}" y="{{ .text_y }}">{{ .name }}</text>{{ end }}
      </svg>
    </div>
  </div>
  {{ with .render_footer }}<div class="logo">{{ . }}</div>{{ end }}
</div>
</body>
</html>
